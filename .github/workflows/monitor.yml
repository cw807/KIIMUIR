name: kiimuir-viewer-monitor

on:
  schedule:
    # 2시간마다 수집. 매시 정각 근처는 GitHub 부하가 몰려 예약 실행이
    # 밀리거나 누락되므로 한산한 분(17분)에 돌린다.
    - cron: '17 */2 * * *'
  workflow_dispatch: {}     # 수동 실행 버튼

concurrency:
  group: viewer-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGE_TIMEOUT_SEC: '10'
          CONCURRENCY: '12'
          CSV_MIN_VIEWERS: '1'   # 0명 행은 저장소에 남기지 않음 (용량 절약)
        run: |
          python monitor.py
