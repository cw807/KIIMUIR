name: kiimuir-viewer-monitor

on:
  schedule:
    # 매시 정각 근처는 GitHub 부하가 몰려 예약 실행이 밀리거나 누락된다.
    # 한산한 분(17분)으로 옮기고, 누락 대비로 47분에 한 번 더 시도한다.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch: {}     # 수동 실행 버튼

concurrency:
  group: viewer-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Skip if already ran recently
        id: guard
        run: |
          LAST=$(git log -1 --format=%ct --grep='^data: ' || echo 0)
          NOW=$(date +%s)
          if [ "$LAST" != "0" ] && [ $((NOW - LAST)) -lt 1800 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "직전 $(( (NOW-LAST)/60 ))분 전에 이미 수집함 — 이번 실행은 건너뜀"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Run monitor
        if: steps.guard.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PAGE_TIMEOUT_SEC: '10'
          CONCURRENCY: '12'
          CSV_MIN_VIEWERS: '1'   # 0명 행은 저장소에 남기지 않음 (용량 절약)
        run: |
          python monitor.py 2>&1 | tee data/last_run.txt

      - name: Commit collected data
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "kiimuir-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/*.csv data/last_run.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: $(date '+%m/%d %H:%M') 수집 [skip ci]"
            git pull --rebase origin main
            git push
          fi
